# Shared Unsloth Studio proxy. Every location that includes this MUST
# also set proxy_pass. Variable host forces Docker DNS on each request
# so a recreated unsloth-studio container is not stuck on a stale IP.
# Do not put `{` `}` in sub_filter strings — nginx treats them as config blocks.
set $unsloth_upstream unsloth-studio:8000;
auth_request /app/api/v1/admin/auth-gate;
proxy_connect_timeout 10s;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
proxy_set_header Accept-Encoding "";
sub_filter '</head>' '<script src="/app/studio-bridge.js"></script></head>';
sub_filter_once on;
