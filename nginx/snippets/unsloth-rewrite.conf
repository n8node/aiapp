# Rewrite Unsloth Vite absolute URLs so the browser stays under /app
# (session cookie Path=/app is not sent to /assets or /api).
# Replacements must not contain the search string (or nginx would loop).
proxy_set_header Accept-Encoding "";
proxy_buffering on;
sub_filter_once off;
sub_filter_types text/html text/css text/javascript application/javascript application/json;
sub_filter '"/assets/' '"/app/studio/_ua/';
sub_filter "'/assets/" "'/app/studio/_ua/";
sub_filter '`/assets/' '`/app/studio/_ua/';
sub_filter 'url(/assets/' 'url(/app/studio/_ua/';
sub_filter '"/favicon.png"' '"/app/studio/_ufavicon.png"';
sub_filter "'/favicon.png'" "'/app/studio/_ufavicon.png'";
sub_filter '"/api/' '"/app/studio/_sapi/';
sub_filter "'/api/" "'/app/studio/_sapi/";
sub_filter '`/api/' '`/app/studio/_sapi/';
sub_filter '"/v1/' '"/app/studio/_sv1/';
sub_filter "'/v1/" "'/app/studio/_sv1/";
sub_filter '`/v1/' '`/app/studio/_sv1/';
