resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

upstream wordpress {
    zone wordpress_upstream 64k;
    server wordpress:80 resolve;
}

server {
    listen 80;
    server_name rigintel.ai www.rigintel.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
