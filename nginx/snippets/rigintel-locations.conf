    location = /xmlrpc.php {
        return 403;
    }

    location ~ ^/(wp-admin|wp-content|wp-includes|wp-json|wp-login\.php|setup-config\.php) {
        proxy_pass http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /app/api/v1/admin/auth-gate {
        internal;
        proxy_pass http://backend/api/v1/admin/auth-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # Studio sends its own Bearer; that is not the RigIntel session.
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /app/studio/ {
        include /etc/nginx/snippets/unsloth-html.conf;
        rewrite ^/app/studio/(.*)$ /$1 break;
        proxy_pass http://$unsloth_upstream;
    }

    # Unsloth Vite/API use site-root paths. Session cookie Path=/ so auth_request sees it.
    location ^~ /assets/ {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location = /favicon.png {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location ^~ /v1/ {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location ^~ /fonts/ {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location ^~ /Sloth {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location = /circle-logo-small.png {
        include /etc/nginx/snippets/unsloth-proxy.conf;
        proxy_pass http://$unsloth_upstream;
    }

    # Unsloth login / password-change stay inside Studio. Never bounce the iframe into the cabinet.
    location ~ ^/(login|onboarding|change-password)(/|$) {
        include /etc/nginx/snippets/unsloth-html.conf;
        proxy_pass http://$unsloth_upstream;
    }

    # Current Studio has no /hub route; older bookmarks still land here.
    location = /hub {
        return 302 /chat;
    }
    location = /hub/ {
        return 302 /chat;
    }

    # TanStack routes are origin-absolute (/chat, /studio, /export, …).
    location ~ ^/(settings|studio|chat|projects|export|data-recipes|images|video|audio|api-monitor|train|compare|search|recipes)(/|$) {
        include /etc/nginx/snippets/unsloth-html.conf;
        proxy_pass http://$unsloth_upstream;
    }

    location ^~ /app/api/v1/disk/ {
        proxy_pass http://backend/api/v1/disk/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /app/api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /app/health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /app/live {
        proxy_pass http://backend/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /app/_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /app {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
