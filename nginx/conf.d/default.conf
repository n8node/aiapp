resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

upstream wordpress {
    zone wordpress_upstream 64k;
    server wordpress:80 resolve;
}

upstream unsloth_studio {
    zone unsloth_upstream 64k;
    server unsloth-studio:8000 resolve;
}

server {
    listen 80;
    server_name localhost rigintel.ai www.rigintel.ai;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/rigintel-locations.conf;
}
