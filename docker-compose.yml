services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - wordpress
    networks:
      - edge
      - app
      - ml
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      TOTP_KEY: ${TOTP_KEY:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-George}
      EXTRACT_URL: http://ai-runtime:8090
      EXTRACT_TOKEN: ${JWT_SECRET}
      GATEWAY_URL: http://model-gateway:8091
      GATEWAY_TOKEN: ${JWT_SECRET}
      STUDIO_URL: http://unsloth-studio:8000
      UNSLOTH_PASSWORD: ${UNSLOTH_PASSWORD:-${JWT_SECRET}}
    depends_on:
      postgres:
        condition: service_healthy
      ai-runtime:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    networks:
      - app
      - data
      - ml
    restart: unless-stopped

  ai-runtime:
    build:
      context: ./ai-runtime
      dockerfile: Dockerfile
    environment:
      EXTRACT_TOKEN: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    networks:
      - app
    restart: unless-stopped

  model-gateway:
    build:
      context: ./model-gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_TOKEN: ${JWT_SECRET}
      VLLM_URL: ${VLLM_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 40s
    networks:
      - app
      - ml
    restart: unless-stopped

  unsloth-studio:
    build:
      context: ./unsloth
      dockerfile: Dockerfile
    image: rigintel/unsloth-studio:local
    environment:
      JUPYTER_PASSWORD: ${UNSLOTH_PASSWORD:-${JWT_SECRET}}
      USER_PASSWORD: ${UNSLOTH_PASSWORD:-${JWT_SECRET}}
      UNSLOTH_STUDIO_TRUST_FORWARDED: "1"
      UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: "1"
      UNSLOTH_STUDIO_PASSWORD: ${UNSLOTH_PASSWORD:-${JWT_SECRET}}
      RIGINTEL_STUDIO_LOCALE: ru
    volumes:
      - unsloth_work:/workspace/work
      - unsloth_auth:/home/unsloth/.unsloth/auth
    networks:
      - ml
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /app/api/v1
        NEXT_PUBLIC_APP_NAME: RigIntel
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    environment:
      NEXT_PUBLIC_API_URL: /app/api/v1
      NEXT_PUBLIC_APP_NAME: RigIntel
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      INTERNAL_API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

  wordpress:
    build: ./wordpress
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
      - wpdata
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WP_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wpdata
    restart: unless-stopped

networks:
  edge:
  app:
  data:
  wpdata:
  ml:

volumes:
  postgres_data:
  mysql_data:
  wp_uploads:
  unsloth_work:
  unsloth_auth:
