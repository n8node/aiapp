# HTML routes: buffering must stay on or nginx sub_filter never rewrites the SPA.
include /etc/nginx/snippets/unsloth-proxy.conf;
proxy_buffering on;
proxy_set_header Accept-Encoding "";
sub_filter '</head>' '<script>try{localStorage.setItem("unsloth_locale","ru")}catch(e){}</script><script src="/app/studio-bridge.js"></script></head>';
sub_filter_once on;
